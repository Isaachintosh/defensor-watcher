name: Deploy DEFENSOR prototype to GitHub Pages

on:
  push:
    branches:
      - main
      - research/app-first-landscape-2026-09-25
    paths:
      - "prototype/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload prototype only
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./prototype"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
